plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        minSdk 21
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "admin123"
            keyAlias "myreleasekey"
            keyPassword "admin123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.zxing:core:3.5.1'
    
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // ================================================================
    // ✅ 混合方案：本地 AAR 优先，远程 Maven 作为后备
    // 1. 本地文件（Gradle 会优先读取它们）
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    
    // 2. 远程 BOM 依赖（如果本地文件缺失，自动从 google() 仓库拉取）
    def media3_version = '1.6.1'
    implementation platform("androidx.media3:media3-bom:$media3_version")
    implementation "androidx.media3:media3-exoplayer"
    implementation "androidx.media3:media3-ui"
    implementation "androidx.media3:media3-exoplayer-hls"
    implementation "androidx.media3:media3-exoplayer-dash"
    implementation "androidx.media3:media3-common"
    implementation "androidx.media3:media3-datasource"
    
    // 3. 补全 AAR 包缺失的底层依赖
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'androidx.annotation:annotation:1.6.0'
    // ================================================================
    
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "com.blankj:utilcodex:1.31.1"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// 🔴 再次强调：千万别加 `configurations.all` 的锁定代码！
