plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.tvlive"
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlive"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // 签名配置（和你 GitHub 密钥完全匹配）
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "admin123"
            keyAlias System.getenv("KEY_ALIAS") ?: "myreleasekey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "admin123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    viewBinding {
        enabled = true
    }

    // 强制忽略依赖版本检查（解决你当前所有报错）
    configurations.all {
        resolutionStrategy.force 'androidx.leanback:leanback:1.1.0'
        resolutionStrategy.force 'androidx.leanback:leanback-grid:1.1.0'
    }
}

dependencies {
    // 基础库
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 电视遥控器适配（降级到 1.1.0，兼容 compileSdk 34）
    implementation 'androidx.leanback:leanback:1.1.0'

    // 播放器
    implementation "com.google.android.exoplayer:exoplayer:2.19.1"

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
