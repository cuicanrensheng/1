plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------- 新增：加载签名配置（兼容本地+GitHub Actions） ----------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tvlive"
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlive"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // ---------- 新增：签名配置（和你密钥对应） ----------
    signingConfigs {
        release {
            // 本地用 keystore.properties，CI 用环境变量
            storeFile keystorePropertiesFile.exists()
                ? file(keystoreProperties['storeFile'])
                : file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword keystoreProperties['storePassword'] ?: System.getenv("STORE_PASSWORD")
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS")
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ---------- 新增：绑定 release 签名 ----------
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    viewBinding {
        enabled = true
    }
}

dependencies {
    // 基础安卓X
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // TV遥控器Leanback适配
    implementation 'androidx.leanback:leanback:1.2.0'
    // ExoPlayer播放器
    implementation "com.google.android.exoplayer:exoplayer:2.19.1"
    // OkHttp网络请求拉取M3U/EPG
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
