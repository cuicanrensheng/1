plugins {

    id 'com.android.application'

}

android {

    namespace "com.tv.live"

    // ====================================================================

    // ✅ 2026-06-23 升级：compileSdk 34 → 36

    // ====================================================================

    // 【为什么升级？】

    // Media3 1.10.1 要求 compileSdk 至少 36，否则编译报错。

    //

    // 【注意】

    // compileSdk 只是编译时用的 SDK 版本，不影响运行时行为。

    // 真正影响运行时行为的是 targetSdk。

    compileSdk 36

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_1_8

        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true

    }

    buildFeatures {

        buildConfig true

    }

    defaultConfig {

        applicationId "com.tv.live"

        // ====================================================================

        // ✅ 2026-06-24 修改：minSdk 23 → 21

        // ====================================================================

        // 【为什么改回 21？】

        // 部分低端电视（如酷开 32P31）底层 Android 版本可能是 5.1（API 22），

        // minSdk 23 会导致这些设备安装时直接报「解析错误」。

        // 为了兼容更多老电视，把 minSdk 降回 21。

        //

        // 【之前为什么升到 23？】

        // 之前误以为 Media3 1.10.1 的 HLS 模块要求 API 23，

        // 实际上 Media3 核心模块和 HLS 模块的 minSdk 都是 21，

        // 降到 21 不会有编译问题。

        //

        // 【影响】

        // 重新支持 Android 5.0/5.1 (API 21-22) 的设备，

        // 覆盖更多低端智能电视和电视盒子。

        //

        // 【风险提示】

        // Android 5.x 的设备比较老，部分新特性可能不支持，

        // 但核心播放功能（Media3 + FFmpeg）应该没问题。

        // 如果遇到兼容性问题，再针对性处理。

        minSdk 21

        // ====================================================================

        // ✅ 2026-06-23 升级：targetSdk 34 → 36

        // ====================================================================

        // 【为什么升级？】

        // 通常 targetSdk 和 compileSdk 保持一致。

        // targetSdk 决定应用的运行时行为模式。

        //

        // 【注意】

        // 升级 targetSdk 可能会引入一些行为变化，需要测试。

        // 比如 Android 13/14/15 的一些权限和行为变化。

        // 但电视应用通常影响不大。

        targetSdk 36

        versionCode 20

        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"

        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {

            abiFilters 'arm64-v8a', 'armeabi-v7a'

        }

    }

    signingConfigs {

        release {

            storeFile file("../release.keystore")

            storePassword "admin123"

            keyAlias "myreleasekey"

            keyPassword "admin123"

            // ====================================================================

            // ✅ 2026-06-24 新增：显式开启 v1 + v2 签名

            // ====================================================================

            // 【为什么加？】

            // Android 系统有两代签名方案：

            //

            // 1. v1 签名（JAR 签名）：

            //    - Android 1.0 就有了，所有版本都支持

            //    - 缺点：速度慢，只能验证完整性，不能验证未篡改

            //

            // 2. v2 签名（APK Signature Scheme v2）：

            //    - Android 7.0（API 24）才引入

            //    - 优点：速度快，安全性高，能验证整个 APK 未被篡改

            //

            // 【问题在哪？】

            // 新版本 AGP + 高 compileSdk，可能默认只生成 v2 签名，

            // 或者 v1 签名被关闭了。

            // 这样 Android 6.0 及以下的设备（比如那台酷开电视）

            // 就认不出这个 APK，直接报「解析程序包时出现问题」。

            //

            // 【解决方案】

            // 显式开启 v1 + v2 两种签名：

            // - v1：给老设备用（Android 6.0 及以下）

            // - v2：给新设备用（Android 7.0 及以上），更快更安全

            //

            // 【为什么老版本没问题？】

            // 老版本 compileSdk 34 + 对应 AGP 版本，默认行为可能是自动开 v1，

            // 新版本可能默认行为变了，或者某些配置导致 v1 被关了。

            // 显式写出来最保险。

            v1SigningEnabled true

            v2SigningEnabled true

        }

        debug {

            storeFile file("../debug.keystore")

            storePassword "android"

            keyAlias "androiddebugkey"

            keyPassword "android"

            // ✅ debug 包也加上，保持一致

            v1SigningEnabled true

            v2SigningEnabled true

        }

    }

    buildTypes {

        release {

            minifyEnabled false

            shrinkResources false

            crunchPngs false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release

        }

        debug {

            signingConfig signingConfigs.debug

        }

    }

    packagingOptions {

        resources {

            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']

        }

    }

    // ====================================================================

    // ✅ 2026-06-23 新增：配置 libs 目录为 AAR 仓库

    // ====================================================================

    // 【为什么需要？】

    // 我们的 FFmpeg 解码器是 AAR 文件，放在 app/libs/ 目录下。

    // 需要告诉 Gradle 从这个目录查找 AAR 依赖。

    //

    // 【注意】

    // 如果你的项目里已经有 flatDir 配置了，就不需要再加了。

    // 直接用 implementation files(...) 引用也行。

    repositories {

        flatDir {

            dirs 'libs'

        }

    }

}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"

    implementation "com.google.android.material:material:1.11.0"

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation "androidx.recyclerview:recyclerview:1.3.2"

    implementation 'com.google.zxing:core:3.5.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    // ====================================================================

    // ✅ 2026-06-23 升级：ExoPlayer 2.19.1 → Media3 1.10.1

    // ====================================================================

    // 【依赖对应关系】

    // 旧版 ExoPlayer 2.x          → 新版 Media3 1.x

    // exoplayer                    → media3-exoplayer

    // exoplayer-ui                 → media3-ui

    // exoplayer-hls                → media3-exoplayer-hls

    // exoplayer-dash               → media3-exoplayer-dash

    // ====================================================================

    // ✅ Media3 核心播放器

    implementation "androidx.media3:media3-exoplayer:1.10.1"

    // ✅ Media3 UI 组件（PlayerView 等）

    implementation "androidx.media3:media3-ui:1.10.1"

    // ✅ Media3 HLS 支持（直播流）

    implementation "androidx.media3:media3-exoplayer-hls:1.10.1"

    // ✅ Media3 DASH 支持

    implementation "androidx.media3:media3-exoplayer-dash:1.10.1"

    // ✅ Media3 通用工具

    implementation "androidx.media3:media3-common:1.10.1"

    // ✅ Media3 数据源

    implementation "androidx.media3:media3-datasource:1.10.1"

    // ====================================================================

    // ✅ 2026-06-23 新增：FFmpeg 解码器扩展

    // ====================================================================

    // 【文件位置】

    // app/libs/lib-decoder-ffmpeg-release.aar

    //

    // 【作用】

    // 集成 FFmpeg 软解码器，当系统硬解码不支持某些格式时，

    // 自动回退到 FFmpeg 软解码，提高兼容性。

    //

    // 【两种引用方式】

    // 方式一：implementation files('libs/lib-decoder-ffmpeg-release.aar')

    //         直接引用文件，简单直接

    //

    // 方式二：implementation(name: 'lib-decoder-ffmpeg-release', ext: 'aar')

    //         需要配合上面的 flatDir 配置使用

    //

    // 这里用方式一，最直接，不容易出错。

    // ====================================================================

    implementation files('libs/lib-decoder-ffmpeg-release.aar')

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"

    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"

    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation "org.apache.commons:commons-lang3:3.14.0"

    implementation "com.blankj:utilcodex:1.31.1"

    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

}
