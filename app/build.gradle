plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    // ====================================================================
    // ✅ compileSdk 保持 36
    // ====================================================================
    // Media3 1.10.1 要求 compileSdk 至少 33，36 完全够用。
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        // ====================================================================
        // ✅ 2026-06-25 改回：minSdk 23 → 21
        // ====================================================================
        // 【为什么改回 21？】
        // 需要兼容低端电视（Android 5.1 / API 22），
        // 所以把 minSdk 降回 21，覆盖更多设备。
        //
        // 【注意事项】
        // ⚠️ Media3 1.10.1 官方要求 minSdk 23，
        // 降到 21 需要在 AndroidManifest 里加 tools:overrideLibrary
        // 强制跳过 Manifest 合并检查。
        //
        // ⚠️ 运行时风险：
        // Media3 1.10.1 内部可能使用了 API 23 才有的接口，
        // 在 Android 5.x（API 21-22）设备上可能运行时崩溃，
        // 需要在实际设备上测试验证。
        //
        // 【为什么不用更低版本的 Media3？】
        // 1.7.1 虽然官方支持 minSdk 21，
        // 但 1.10.1 有更多 bug 修复和性能优化，
        // 而且 FFmpeg AAR 已经基于 1.10.1 编译好了，
        // 所以优先尝试用 1.10.1 + overrideLibrary 的方案。
        minSdk 21

        // ====================================================================
        // ✅ targetSdk 保持 36
        // ====================================================================
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "admin123"
            keyAlias "myreleasekey"
            keyPassword "admin123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
        }
    }

    // ====================================================================
    // ✅ 配置 libs 目录为 AAR 仓库
    // ====================================================================
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ====================================================================
    // ✅ Media3 1.10.1（最新稳定版）
    // ====================================================================
    // 【为什么用 1.10.1 而不是 1.7.1？】
    // 1.10.1 有更多 bug 修复和性能优化，
    // 而且 FFmpeg AAR 已经基于 1.10.1 编译好了。
    // 虽然官方要求 minSdk 23，
    // 但我们用 tools:overrideLibrary 强制降到 21，
    // 只要运行时不 crash 就能用。
    //
    // 【风险】
    // ⚠️ Android 5.x 设备上可能运行时崩溃，
    // 需要实际测试验证。如果 crash 再降级到 1.7.1。

    // ✅ Media3 核心播放器
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    // ✅ Media3 UI 组件（PlayerView 等）
    implementation "androidx.media3:media3-ui:1.10.1"
    // ✅ Media3 HLS 支持（直播流）
    implementation "androidx.media3:media3-exoplayer-hls:1.10.1"
    // ✅ Media3 DASH 支持
    implementation "androidx.media3:media3-exoplayer-dash:1.10.1"
    // ✅ Media3 通用工具
    implementation "androidx.media3:media3-common:1.10.1"
    // ✅ Media3 数据源
    implementation "androidx.media3:media3-datasource:1.10.1"

    // ====================================================================
    // ✅ FFmpeg 软解码器扩展（已基于 1.10.1 编译）
    // ====================================================================
    // 【作用】
    // FFmpeg 软解码器扩展，作为系统硬解码的备用方案。
    // 当系统 MediaCodec 不支持某些视频格式时，自动回退到 FFmpeg 软解码，
    // 提高格式兼容性，保证更多直播源能正常播放。
    //
    // 【编译信息】
    // - 源码版本：Media3 1.10.1
    // - 模块名：lib-decoder-ffmpeg
    // - 编译环境：NDK 23.1.7779620 + JDK 17
    // - 支持架构：arm64-v8a, armeabi-v7a
    // - 编译方式：GitHub Actions 自动编译
    implementation files('libs/lib-decoder-ffmpeg-release.aar')

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "com.blankj:utilcodex:1.31.1"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}
