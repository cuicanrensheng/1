plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.tvlive"
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlive"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // 开启全面HTTP明文支持（解决电视盒子无法播放问题）
        manifestPlaceholders = [
            usesCleartextTraffic: "true"
        ]
    }

    // 签名配置（与你的GitHub Secrets完美匹配）
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "admin123"
            keyAlias System.getenv("KEY_ALIAS") ?: "myreleasekey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "admin123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    viewBinding {
        enabled = true
    }

    // 禁止严格的AndroidX冲突检查（解决你当前的构建报错）
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // AndroidX 基础库
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 电视/遥控器适配
    implementation 'androidx.leanback:leanback:1.2.0'

    // 播放器
    implementation "com.google.android.exoplayer:exoplayer:2.19.1"

    // 网络请求（支持HTTP/HTTPS）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
