plugins {

    id 'com.android.application'

}

android {

    namespace "com.tv.live"

    // ====================================================================

    // ✅ 2026-06-24 修改：compileSdk 34 → 36

    // ====================================================================

    // 【为什么用 36？】

    // Media3 1.5.0 要求 compileSdk 至少 35，我们直接用 36，

    // 跟之前 1.10.1 保持一致，省得来回改。

    //

    // 【注意】

    // compileSdk 只是编译时用的 SDK 版本，不影响运行时行为。

    // minSdk 还是 21，照样兼容 Android 5.0+ 的设备。

    compileSdk 36

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_1_8

        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true

    }

    buildFeatures {

        buildConfig true

    }

    defaultConfig {

        applicationId "com.tv.live"

        // ====================================================================

        // ✅ minSdk 保持 21

        // ====================================================================

        // Media3 1.5.0 官方支持 minSdk 21，

        // 不需要 tools:overrideLibrary，直接用就行。

        minSdk 21

        // ====================================================================

        // ✅ targetSdk 保持 36

        // ====================================================================

        // 跟 compileSdk 保持一致。

        targetSdk 36

        versionCode 20

        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"

        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {

            abiFilters 'arm64-v8a', 'armeabi-v7a'

        }

    }

    signingConfigs {

        release {

            storeFile file("../release.keystore")

            storePassword "admin123"

            keyAlias "myreleasekey"

            keyPassword "admin123"

            // ✅ 显式开启 v1 + v2 签名

            v1SigningEnabled true

            v2SigningEnabled true

        }

        debug {

            storeFile file("../debug.keystore")

            storePassword "android"

            keyAlias "androiddebugkey"

            keyPassword "android"

            v1SigningEnabled true

            v2SigningEnabled true

        }

    }

    buildTypes {

        release {

            minifyEnabled false

            shrinkResources false

            crunchPngs false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release

        }

        debug {

            signingConfig signingConfigs.debug

        }

    }

    packagingOptions {

        resources {

            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']

        }

    }

    // ====================================================================

    // ✅ 配置 libs 目录为 AAR 仓库

    // ====================================================================

    repositories {

        flatDir {

            dirs 'libs'

        }

    }

}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"

    implementation "com.google.android.material:material:1.11.0"

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation "androidx.recyclerview:recyclerview:1.3.2"

    implementation 'com.google.zxing:core:3.5.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    // ====================================================================

    // ✅ Media3 1.5.0

    // ====================================================================

    // 【为什么用 1.5.0？】

    // Media3 从 1.8.0 开始把 minSdk 从 21 升到了 23，

    // 1.5.0 是官方支持 minSdk 21 的版本，不需要 tools:overrideLibrary。

    //

    // 【注意】

    // 1.5.0 要求 compileSdk 至少 35，所以我们用 36。

    // compileSdk 只是编译时用的，不影响运行时兼容性。

    // ====================================================================

    // ✅ Media3 核心播放器

    implementation "androidx.media3:media3-exoplayer:1.5.0"

    // ✅ Media3 UI 组件（PlayerView 等）

    implementation "androidx.media3:media3-ui:1.5.0"

    // ✅ Media3 HLS 支持（直播流）

    implementation "androidx.media3:media3-exoplayer-hls:1.5.0"

    // ✅ Media3 DASH 支持

    implementation "androidx.media3:media3-exoplayer-dash:1.5.0"

    // ✅ Media3 通用工具

    implementation "androidx.media3:media3-common:1.5.0"

    // ✅ Media3 数据源

    implementation "androidx.media3:media3-datasource:1.5.0"

    // ====================================================================

    // ⚠️ FFmpeg AAR 版本可能不兼容

    // ====================================================================

    // 你现在的 FFmpeg AAR 是 1.10.1 版本的，

    // 降到 1.5.0 后可能会有兼容性问题。

    // 你说不用动，那就先保留，有问题再说。

    implementation files('libs/lib-decoder-ffmpeg-release.aar')

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"

    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"

    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation "org.apache.commons:commons-lang3:3.14.0"

    implementation "com.blankj:utilcodex:1.31.1"

    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

}
