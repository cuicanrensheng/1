plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    // ====================================================================
    // ✅ compileSdk 保持 36
    // ====================================================================
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        // ====================================================================
        // ✅ 2026-06-25 降级：minSdk 23 → 21
        // ====================================================================
        minSdk 21
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // ====================================================================
    // ✅ 【核心修改】动态签名配置，安全兼容 GitHub Actions 和 本地编译
    // ====================================================================
    signingConfigs {
        release {
            // 判断是否为 CI 环境（GitHub Actions）
            if (System.getenv('CI') == 'true') {
                // CI 环境（云端）：读取 GitHub Secrets 注入的环境变量
                storeFile file('release.keystore') // 注意：路径是相对于 app 目录的
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                // 本地电脑编译：尝试从 local.properties 读取（避免把密码传到 GitHub）
                def localProps = new Properties()
                def localPropFile = rootProject.file('local.properties')
                if (localPropFile.exists()) {
                    localProps.load(localPropFile.newDataInputStream())
                    storeFile file(localProps.getProperty('storeFile', '../release.keystore'))
                    storePassword localProps.getProperty('storePassword', 'admin123')
                    keyAlias localProps.getProperty('keyAlias', 'myreleasekey')
                    keyPassword localProps.getProperty('keyPassword', 'admin123')
                } else {
                    // 没有 local.properties 时的兜底
                    storeFile file("../release.keystore")
                    storePassword "admin123"
                    keyAlias "myreleasekey"
                    keyPassword "admin123"
                }
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ✅ Media3 核心播放器
    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.7.1"
    implementation "androidx.media3:media3-common:1.7.1"
    implementation "androidx.media3:media3-datasource:1.7.1"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "com.blankj:utilcodex:1.31.1"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}
