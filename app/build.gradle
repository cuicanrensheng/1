plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    // ====================================================================
    // ✅ compileSdk 保持 36
    // ====================================================================
    // Media3 1.10.1 要求 compileSdk 至少 33，36 完全够用。
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        // ====================================================================
        // ✅ 2026-06-25 升级：minSdk 21 → 23
        // ====================================================================
        // 【为什么升到 23？】
        // Media3 从 1.8.0 开始官方把 minSdk 升到了 23，
        // 升到 23 后就可以用最新的 Media3 1.10.1，
        // 享受最新的 bug 修复和性能优化。
        //
        // 【影响】
        // Android 5.0/5.1（API 21-22）的设备将无法安装。
        // 但目前 Android 5.x 的市场占有率已经很低了，
        // 而且电视设备大部分都是 Android 6.0+，影响不大。
        minSdk 23

        // ====================================================================
        // ✅ targetSdk 保持 36
        // ====================================================================
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "admin123"
            keyAlias "myreleasekey"
            keyPassword "admin123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
        }
    }

    // ====================================================================
    // ✅ 配置 libs 目录为 AAR 仓库
    // ====================================================================
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ====================================================================
    // ✅ Media3 1.10.1（最新稳定版）
    // ====================================================================
    // 【为什么用 1.10.1？】
    // minSdk 升到 23 后，就可以用最新的 Media3 稳定版了。
    // 1.10.1 是目前（2026年5月）最新的稳定版本，
    // 包含了大量 bug 修复、性能优化和新功能。
    //
    // 【主要优势】
    // 1. 大量 bug 修复，稳定性大幅提升
    // 2. HLS/DASH 处理优化，减少卡顿和缓冲
    // 3. 解码器兼容性改进，支持更多格式
    // 4. 性能优化，启动更快，内存占用更低
    // 5. PlayerView 控件优化
    // 6. 新增更多 API 和配置选项
    // 7. 安全漏洞修复

    // ✅ Media3 核心播放器
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    // ✅ Media3 UI 组件（PlayerView 等）
    implementation "androidx.media3:media3-ui:1.10.1"
    // ✅ Media3 HLS 支持（直播流）
    implementation "androidx.media3:media3-exoplayer-hls:1.10.1"
    // ✅ Media3 DASH 支持
    implementation "androidx.media3:media3-exoplayer-dash:1.10.1"
    // ✅ Media3 通用工具
    implementation "androidx.media3:media3-common:1.10.1"
    // ✅ Media3 数据源
    implementation "androidx.media3:media3-datasource:1.10.1"

    // ====================================================================
    // ✅ 2026-06-25 更新：FFmpeg 软解码器扩展（已基于 1.10.1 编译）
    // ====================================================================
    // 【作用】
    // FFmpeg 软解码器扩展，作为系统硬解码的备用方案。
    // 当系统 MediaCodec 不支持某些视频格式时，自动回退到 FFmpeg 软解码，
    // 提高格式兼容性，保证更多直播源能正常播放。
    //
    // 【编译信息】
    // - 源码版本：Media3 1.10.1
    // - 模块名：lib-decoder-ffmpeg
    // - 编译环境：NDK 23.1.7779620 + JDK 17
    // - 支持架构：arm64-v8a, armeabi-v7a
    // - 编译方式：GitHub Actions 自动编译
    //
    // 【工作模式】
    // - 硬解模式（默认）：系统硬解优先，FFmpeg 作为备用
    // - 软解模式：优先使用 FFmpeg 软解
    implementation files('libs/lib-decoder-ffmpeg-release.aar')

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "com.blankj:utilcodex:1.31.1"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}
