plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    compileSdk 36 // 和targetSdk统一，消除AGP版本警告

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        minSdk 21
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            // 增加空判断，本地调试不崩溃
            def storeP = project.hasProperty("storePassword") ? project.findProperty("storePassword") : ""
            def keyA = project.hasProperty("keyAlias") ? project.findProperty("keyAlias") : ""
            def keyP = project.hasProperty("keyPassword") ? project.findProperty("keyPassword") : ""
            storePassword storeP
            keyAlias keyA
            keyPassword keyP

            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {}
    }

    buildTypes {
        release {
            // 建议线上开启混淆与资源压缩
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // 统一资源冲突处理，废弃零散pickFirst
    packaging {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            pickFirsts += ['lib/armeabi-v7a/libhyaudioengine.so']
            pickFirsts += ['lib/arm64-v8a/libhyaudioengine.so']
            pickFirsts += ['lib/x86/libhyaudioengine.so']
        }
    }

    // 🟢【核心修复】加上 checkReleaseBuilds false，彻底解决 lintVitalRelease 自动生成基线导致的阻断
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false  // 加上这一行
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // 1. 标准依赖berry_lib子模块，删除原来跨目录sourceSets
    implementation project(':berry_lib')
    // 仅保留app目录下独立本地包，无重复so/aar
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // UI基础库
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'androidx.recyclerview:recyclerview'

    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Media3 统一锁定1.7.1，彻底屏蔽旧ExoPlayer
    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.7.1"
    implementation "androidx.media3:media3-common:1.7.1"
    implementation "androidx.media3:media3-datasource:1.7.1"
    implementation "androidx.media3-decoder:1.7.1"
    implementation "androidx.media3-extractor:1.7.1"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation "org.apache.commons:commons-lang3:3.14.0"

    // 第三方库排除旧ExoPlayer
    implementation("com.blankj:utilcodex:1.31.1") {
        exclude group: 'com.google.android.exoplayer2'
    }
    implementation('org.nanohttpd:nanohttpd:2.3.1') {
        exclude group: 'com.google.android.exoplayer2'
    }
}

// 全局强制Media3版本，杜绝版本漂移
configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
        force "androidx.media3:media3-exoplayer-dash:1.7.1"
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-datasource:1.7.1"
        force "androidx.media3-decoder:1.7.1"
        force "androidx.media3-extractor:1.7.1"
    }
}
