plugins {
    id 'com.android.application'
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def group = details.requested.group
        // 全部Media3强制1.6.1（保留TrackGroupArray）
        if (group.startsWith("androidx.media3")) {
            details.useVersion("1.6.1")
            details.because("降级到1.6.1，保留TrackGroupArray类，兼容原有清晰度切换代码")
        }
        // 统一okhttp版本
        if (group == "com.squareup.okhttp3") {
            details.useVersion("4.12.0")
        }
        // 拦截老旧exoplayer
        if (group == "com.google.android.exoplayer") {
            details.useTarget("androidx.media3:media3-exoplayer:1.6.1")
        }
    }
}

android {
    namespace "com.tv.live"

    compileSdk 36

    compileOptions {
        // 建议升至 Java 17，适配 CI 环境 JDK 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tv.live"

        minSdk 21
        targetSdk 36

        versionCode 20
        versionName "2.0"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "admin123"
            keyAlias "myreleasekey"
            keyPassword "admin123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // ✅ 修复了 recyclerview 的包名
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.zxing:core:3.5.1'
    
    // ✅ 修复了 gson 的包名
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Media3 全套 1.6.1
    implementation "androidx.media3:media3-exoplayer:1.6.1"
    implementation "androidx.media3:media3-ui:1.6.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.6.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.6.1"
    implementation "androidx.media3:media3-common:1.6.1"
    implementation "androidx.media3:media3-datasource:1.6.1"

    // 仅保留4.12，删除4.9.3冲突
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "com.blankj:utilcodex:1.31.1"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
