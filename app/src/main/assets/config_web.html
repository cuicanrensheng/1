<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IPTV WEB配置 端口10481</title>
<style>
body{padding:20px;font-size:16px;}
input{width:100%;margin:8px 0;padding:8px;font-size:16px;}
button{padding:10px 20px;margin:5px;}
</style>
</head>
<body>
<h3>全局请求头Header设置</h3>
<input id="ua" placeholder="UA默认ExoPlayer">
<input id="ref" placeholder="自定义Referer链接">
<input id="ck" placeholder="自定义Cookie内容">
<button id="saveHeader">保存全局Header</button>

<h3>M3U订阅源添加</h3>
<input id="subIn" placeholder="粘贴M3U订阅地址">
<button id="addSub">添加并自动解析频道</button>

<h3>EPG节目指南XML地址</h3>
<input id="epgIn" placeholder="粘贴EPG xml链接">
<button id="addEpg">添加EPG数据源</button>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script>
$("#saveHeader").click(function(){
    let ua=$("#ua").val().trim();
    let ref=$("#ref").val().trim();
    let ck=$("#ck").val().trim();
    $.post("/api/saveHeader",{ua,ref,ck},res=>alert("Header保存成功，全局生效"));
})
$("#addSub").click(function(){
    let url=$("#subIn").val().trim();
    if(!url)return alert("链接不能为空");
    $.post("/api/addSub",{url:url},res=>{
        alert("M3U添加成功，自动加载频道");
        $("#subIn").val("");
    })
})
$("#addEpg").click(function(){
    let url=$("#epgIn").val().trim();
    if(!url)return alert("链接不能为空");
    $.post("/api/addEpg",{url:url},res=>{
        alert("EPG添加成功");
        $("#epgIn").val("");
    })
})
</script>
</body>
</html>
