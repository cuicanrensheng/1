name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 清理缓存并强制刷新依赖
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          ./gradlew clean

      - name: 解码签名证书并注入密钥
        run: |
          echo "🔑 正在解码签名证书..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

          echo "🔍 正在静默验证依赖版本..."
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

          echo "🎯 开始执行 Release 打包..."
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      # 🟢 读取 release_notes.txt 的内容作为更新日志
      - name: 获取更新日志内容
        id: get_update_message
        run: |
          if [ -f "release_notes.txt" ]; then
            MSG=$(cat release_notes.txt | sed 's/"/\\"/g' | tr '\n' ' ')
            echo "message=$MSG" >> $GITHUB_OUTPUT
            echo "✅ 读取到更新日志：$MSG"
          else
            echo "⚠️ 未找到 release_notes.txt，使用默认消息"
            echo "message=自动更新版本" >> $GITHUB_OUTPUT
          fi

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          RELEASE_MSG="${{ steps.get_update_message.outputs.message }}"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "$RELEASE_MSG",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          body: ${{ steps.get_update_message.outputs.message }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🟢【新增】自动将最新 update.json 推送回 main 分支
      - name: 自动提交 update.json 到 main 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          # 将当前目录生成的 update.json 复制到工作区
          cp update.json update.json
          git add update.json
          # 🔥 加上 [skip ci] 防止触发死循环构建
          git commit -m "[skip ci] 自动更新 update.json 到 v${{ github.run_number }}" || echo "无变更跳过"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
