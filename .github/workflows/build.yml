name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 清理缓存并强制刷新依赖
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          ./gradlew clean

      - name: 解码签名证书并注入密钥
        run: |
          echo "🔑 正在解码签名证书..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

          echo "🔍 正在静默验证依赖版本..."
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

      # 🟢【新增 1】运行 Android Lint 静态代码检查（不阻断构建，发现错误也会继续打包）
      - name: Run Lint
        run: ./gradlew lintRelease -Pandroid.lint.abortOnError=false

      # 🟢【新增 2】运行单元测试（发现失败会阻断构建，确保业务逻辑正确）
      - name: Run Unit Tests
        run: ./gradlew testRelease --no-daemon --stacktrace

      # 🟢【新增 3】上传 Lint 报告，方便查看所有代码问题
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html

      # 🟢【新增 4】上传单元测试报告
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testReleaseUnitTest/index.html

      # 🟢【新增 5】上传 Lint 基线文件（方便您直接下载并提交到仓库）
      - name: Upload Lint Baseline
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline
          path: app/lint-baseline.xml

      - name: 开始执行 Release 打包...
        run: |
          echo "🎯 开始执行 Release 打包..."
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
