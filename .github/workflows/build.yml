name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 静默依赖检查与打包
        run: |
          echo "🔍 正在静默验证依赖版本..."
          
          # 1. 即使 gradlew 失败也继续执行，防止脚本瞬间崩溃
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --no-daemon 2>&1 || true)
          
          # 2. 检查依赖树是否包含 1.7.1
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1！可能依赖解析失败。"
            echo "⚠️ 下面是依赖解析失败的具体报错信息（只打印错误提示）："
            echo "$DEPS_OUTPUT" | grep -E "(FAILED|Failed|not found|resolve|Could not)" | head -n 10 || echo "⚠️ 未捕获到详细错误，可能是其他构建任务出错。"
            exit 1
          fi
          
          # 3. 检查是否混入旧版 ExoPlayer
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

          echo "🎯 开始执行标准 Release 打包..."
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
