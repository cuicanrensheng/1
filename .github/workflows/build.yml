name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17 + Gradle缓存
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 缓存 Gradle 分发文件
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: 自动生成默认图标
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          apt update && apt install -y imagemagick
          convert -size 96x96 xc:#3F51B5 app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: 配置gradle签名参数
        run: |
          echo "MY_STORE_FILE=../release.keystore" >> gradle.properties
          echo "MY_STORE_PASSWORD=admin123" >> gradle.properties
          echo "MY_KEY_ALIAS=myreleasekey" >> gradle.properties
          echo "MY_KEY_PASSWORD=admin123" >> gradle.properties

      # ==========新增布局自动生成步骤 start==========
      - name: 批量生成全部layout布局
        run: |
          mkdir -p app/src/main/res/layout
          # activity_play.xml
          cat > app/src/main/res/layout/activity_play.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    android:layout_width="match_parent"
    android:layout_height="match_parent">
    <SurfaceView android:id="@+id/surface" android:layout_width="match_parent" android:layout_height="match_parent"/>
    <TextView android:id="@+id/tv_top_ch_num" android:textColor="#FFFFFF" android:textSize="56sp" android:visibility="gone" android:layout_marginTop="20dp" android:layout_marginEnd="24dp" android:layout_width="wrap_content" android:layout_height="wrap_content" app:layout_constraintTop_toTopOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
    <include android:id="@+id/ll_osd_root" layout="@layout/osd_info" android:layout_width="match_parent" android:layout_height="wrap_content" app:layout_constraintBottom_toBottomOf="parent"/>
</androidx.constraintlayout.widget.ConstraintLayout>
EOF
          # osd_info.xml
          cat > app/src/main/res/layout/osd_info.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="wrap_content"
    android:background="#CC000000"
    android:padding="12dp"
    android:orientation="vertical">
    <TextView android:id="@+id/tv_ch_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="20sp"/>
    <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
        <TextView android:id="@+id/tv_ch_no" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF"/>
        <TextView android:id="@+id/tv_fhd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="HD" android:textColor="#0F0" android:layout_marginStart="8dp"/>
    </LinearLayout>
    <TextView android:id="@+id/tv_epg_info" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#DDDDDD" android:textSize="14sp"/>
</LinearLayout>
EOF
          # activity_setting.xml
          cat > app/src/main/res/layout/activity_setting.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="12dp">
<LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_marginBottom="8dp">
<TextView android:text="全局Header配置" android:textSize="18sp" android:textColor="#000000" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
<EditText android:id="@+id/et_ua" android:hint="UA默认ExoPlayer" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<EditText android:id="@+id/et_ref" android:hint="自定义Referer(留空不携带)" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<EditText android:id="@+id/et_ck" android:hint="自定义Cookie(留空不携带)" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_save_header" android:text="保存Header配置" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<TextView android:text="定时自动刷新设置" android:textSize="18sp" android:layout_marginTop="10dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
<CheckBox android:id="@+id/cb_auto_refresh" android:text="开启每日自动刷新订阅源" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_open_web" android:text="开启局域网WEB配置(10481端口)" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_parse_log" android:text="查看解析日志" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_opt_log" android:text="查看操作日志" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_clear_cache" android:text="清除本地EPG缓存" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<TextView android:text="订阅源配置" android:textSize="18sp" android:layout_marginTop="12dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
<EditText android:id="@+id/et_m3u_url" android:text="https://mirror.ghproxy.com/https://raw.githubusercontent.com/cuicanrensheng/IPTV/refs/heads/main/playlist1.m3u" android:hint="M3U直播源地址" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<EditText android:id="@+id/et_epg_url" android:text="https://epg.catvod.com/epg.xml" android:hint="EPG节目单地址" android:layout_width="match_parent" android:layout_height="wrap_content"/>
<Button android:id="@+id/btn_save_source" android:text="保存源地址" android:layout_width="match_parent" android:layout_height="wrap_content"/>
</LinearLayout>
</ScrollView>
EOF
          # dialog_epg.xml
          cat > app/src/main/res/layout/dialog_epg.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="12dp" android:background="#CC000000">
<ListView android:id="@+id/lv_epg" android:textColor="#ffffff" android:layout_width="match_parent" android:layout_height="match_parent"/>
</LinearLayout>
EOF
      # ==========新增布局自动生成步骤 end==========

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译 Release 签名APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "版本自动更新",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: IPTV播放器-v${{ github.run_number }}
          body: |
            ✅ 自动编译+正式签名打包
            📌 版本：v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
