name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      # 🚀 深度清扫 + 依赖完整性诊断 + 强制打包
      - name: 深度清扫、依赖诊断与强制打包
        run: |
          echo "1. 彻底铲除 Gradle 和 Maven 本地缓存..."
          sudo rm -rf ~/.gradle/ ~/.m2/ && mkdir -p ~/.gradle/

          echo "2. 清理项目残留编译文件与构建目录（防止增量编译缓存干扰）..."
          ./gradlew clean
          rm -rf app/build  # 🔴 这步是解决你错误的核心：删掉整个编译输出目录

          echo "3. 🔍【关键诊断】检查下载的 media3-common AAR 里是否真的包含 TrackGroupArray.class"
          find ~/.gradle/caches/ -name "media3-common-1.6.1.aar" -exec unzip -l {} \; | grep "TrackGroupArray" || echo "⚠️ 警告：AAR 中缺失 TrackGroupArray.class！需要重新下载"

          echo "4. 🎯 以 --info 详细日志模式强制刷新所有依赖并打包 Release..."
          ./gradlew assembleRelease --no-daemon --no-build-cache --refresh-dependencies --info --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
