name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      # 🚀 彻底清理所有缓存
      - name: 全局清理全部缓存
        run: |
          echo "1. 删除全部 androidx.media3 缓存文件"
          sudo rm -rf ~/.gradle/caches/modules-2/files-2.1/androidx.media3
          sudo rm -rf ~/.gradle/caches/modules-2/modules-2.0/androidx.media3
          sudo rm -rf ~/.gradle/caches/transforms-3/
          sudo rm -rf ~/.gradle/wrapper/dists
          sudo rm -rf ~/.m2/
          
          echo "2. 清理项目构建产物"
          rm -rf .gradle
          ./gradlew clean
          rm -rf app/build
          rm -rf app/libs

      # 🎯 物理注入：下载100%完整的本地AAR并修改Gradle配置
      - name: 注入本地完整AAR（规避远程缓存损坏）
        run: |
          echo "3. 创建 app/libs 目录并下载完整的 Media3 1.7.0 AAR..."
          mkdir -p app/libs
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-common/1.7.0/media3-common-1.7.0.aar
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-exoplayer/1.7.0/media3-exoplayer-1.7.0.aar
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-ui/1.7.0/media3-ui-1.7.0.aar
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-exoplayer-hls/1.7.0/media3-exoplayer-hls-1.7.0.aar
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-exoplayer-dash/1.7.0/media3-exoplayer-dash-1.7.0.aar
          wget -P app/libs/ https://repo1.maven.org/maven2/androidx/media3/media3-datasource/1.7.0/media3-datasource-1.7.0.aar

          echo "4. 自动修改 app/build.gradle 注入本地文件树..."
          # 如果 dependencies 里没有 fileTree 就自动加上
          grep -q "fileTree(dir: 'libs'" app/build.gradle || sed -i '/dependencies {/a \    implementation fileTree(dir: '\''libs'\'', include: ['\''*.aar'\''])' app/build.gradle

      # 🔍 诊断依赖树
      - name: 校验依赖树
        run: ./gradlew :app:dependencies --configuration releaseCompileClasspath | grep media3

      # 🎯 正式打包（此刻Gradle只会从app/libs读取完整AAR）
      - name: 强制刷新依赖并打包Release
        run: ./gradlew assembleRelease --no-daemon --no-build-cache --refresh-dependencies --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
