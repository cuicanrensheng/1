name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 清理缓存与构建产物（保留 AAR）
        run: |
          echo "1. 删除远程 Gradle 缓存..."
          sudo rm -rf ~/.gradle/caches/modules-2/files-2.1/androidx.media3
          sudo rm -rf ~/.gradle/caches/modules-2/modules-2.0/androidx.media3
          sudo rm -rf ~/.gradle/caches/transforms-3/
          sudo rm -rf ~/.gradle/wrapper/dists
          sudo rm -rf ~/.m2/
          
          echo "2. 清理项目构建产物，但保留本地 libs 文件夹..."
          rm -rf .gradle
          ./gradlew clean
          rm -rf app/build
          # 注意：不要 rm -rf app/libs！

      - name: 检查本地 AAR 文件是否到位
        run: |
          echo "🔍 检查 app/libs 目录下的 AAR 文件..."
          ls -la app/libs/

      - name: 正式打包（直接使用 app/libs 下的本地 AAR）
        run: ./gradlew assembleRelease --no-daemon --no-build-cache --refresh-dependencies --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
