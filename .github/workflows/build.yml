name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17 + Gradle 缓存
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 缓存 Gradle 分发文件，避免每次都下载
      - name: 缓存 Gradle 分发文件
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: 自动生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 9.5.1

      - name: 赋予执行权限
        run: chmod +x gradlew

      # 🟢【新增关键步骤1】从 Secrets 还原 release.keystore 到 app 目录下
      - name: 还原 release.keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      # 🟢【优化版本读取】动态获取 build.gradle 中的 versionCode 和 versionName
      - name: 获取版本号
        id: version
        run: |
          VERCODE=$(grep -oP 'versionCode \K\d+' app/build.gradle | head -n 1)
          VERNAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -n 1)
          echo "versionCode=$VERCODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERNAME" >> $GITHUB_OUTPUT

      # 🟢【新增关键步骤2】编译时注入 Secrets 里的密码和别名环境变量
      - name: 编译 Release 签名版 APK
        run: ./gradlew assembleRelease --no-build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ steps.version.outputs.versionCode }}
          VERSION_NAME=${{ steps.version.outputs.versionName }}
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.versionCode }}
          name: 自动发布 v${{ steps.version.outputs.versionCode }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
