name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予 Gradle 脚本执行权限
        run: chmod +x gradlew

      - name: 清理缓存与构建产物
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          # 指定app子模块clean，解决根任务不存在报错
          ./gradlew :app:clean --refresh-dependencies

      - name: 解码签名证书并校验依赖
        run: |
          echo "🔑 解码release签名证书..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

          echo "🔍 校验依赖：仅使用Media3，禁止旧ExoPlayer"
          DEPS_OUTPUT=$(./gradlew :app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ Media3 1.7.1 版本校验通过"
          else
            echo "❌ 未找到 Media3 1.7.1 依赖，构建终止"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 检测到废弃 ExoPlayer 依赖，构建终止"
            exit 1
          else
            echo "✅ 无旧版ExoPlayer，依赖安全校验通过"
          fi

      # 静态代码检查，失败不阻断后续流程
      - name: Run Android Lint Release
        run: ./gradlew :app:lintRelease -Pandroid.lint.abortOnError=false --no-daemon
        continue-on-error: true

      # 单元测试，测试失败会终止构建
      - name: Run Release Unit Tests
        run: ./gradlew :app:testRelease --no-daemon --stacktrace

      - name: 上传Lint报告
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html

      - name: 上传单元测试报告
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testReleaseUnitTest/index.html

      - name: 上传Lint基线文件
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline
          path: app/lint-baseline.xml

      - name: 编译Release签名APK
        run: |
          echo "🎯 开始打包正式Release安装包"
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: 生成自动更新配置update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "CI自动构建更新包",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传APK产物到工作流制品
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置文件
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建GitHub Release发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动构建版本 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
