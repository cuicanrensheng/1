name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      # 🚀 终极清理、官方源验证与强制刷新打包
      - name: 终极清理、依赖验证与打包
        run: |
          echo "1. 彻底铲除所有本地缓存..."
          rm -rf ~/.gradle/ ~/.m2/

          echo "2. 清理项目残留文件..."
          ./gradlew clean

          echo "3. 【诊断】打印依赖树（确保看到 androidx.media3:media3-common:1.7.1）"
          ./gradlew :app:dependencies --no-daemon --refresh-dependencies

          echo "4. 🎯【核弹级修复】刷新所有依赖索引，开始正式打包..."
          # 必须加上 --refresh-dependencies，让 Gradle 忘记所有旧索引！
          ./gradlew assembleRelease --no-daemon --no-build-cache --refresh-dependencies --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
