name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修改：java-version改为17
      - name: 设置 JDK 17 + Gradle缓存
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 缓存 Gradle 分发文件
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          
        - name: 自动生成默认图标
          run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          # 生成最小合法png占位图
          apt update && apt install -y imagemagick
          convert -size 96x96 xc:#3F51B5 app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: 配置gradle签名参数
        run: |
          echo "MY_STORE_FILE=../release.keystore" >> gradle.properties
          echo "MY_STORE_PASSWORD=admin123" >> gradle.properties
          echo "MY_KEY_ALIAS=myreleasekey" >> gradle.properties
          echo "MY_KEY_PASSWORD=admin123" >> gradle.properties

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译 Release 签名APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "版本自动更新",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: IPTV播放器-v${{ github.run_number }}
          body: |
            ✅ 自动编译+正式签名打包
            📌 版本：v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
