name: Build TV Live APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      # 🚀 彻底清理所有Gradle缓存，根除残缺Media3 AAR
      - name: 全局清理全部Gradle缓存
        run: |
          echo "1. 删除全部 androidx.media3 缓存文件"
          sudo rm -rf ~/.gradle/caches/modules-2/files-2.1/androidx.media3
          sudo rm -rf ~/.gradle/caches/modules-2/modules-2.0/androidx.media3
          sudo rm -rf ~/.gradle/caches/transforms-3/
          sudo rm -rf ~/.gradle/wrapper/dists
          sudo rm -rf ~/.m2/
          
          echo "2. 清理项目构建产物"
          rm -rf .gradle
          ./gradlew clean
          rm -rf app/build

      # 新增：诊断依赖树，确认media3-common被正常加载
      - name: 校验Media3依赖是否加载成功
        run: ./gradlew :app:dependencies --configuration releaseCompileClasspath | grep media3

      # 🎯 强制联网重下所有依赖，禁用缓存、守护进程、构建缓存
      - name: 强制刷新依赖并打包Release
        run: ./gradlew assembleRelease --no-daemon --no-build-cache --refresh-dependencies --no-offline --stacktrace

      - name: 生成 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "自动更新版本",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
