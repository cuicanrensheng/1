name: 清理全部构建记录
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 删除所有Workflow运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let page = 1;
            const pageSize = 100;
            while (true) {
              // 正确API，不拼接workflow_id，不会产生双斜杠404
              const result = await github.rest.actions.listWorkflowRuns({
                owner: owner,
                repo: repo,
                per_page: pageSize,
                page: page
              });
              const runs = result.data.workflow_runs;
              if (runs.length === 0) break;
              // 逐条删除
              for (const run of runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: owner,
                  repo: repo,
                  run_id: run.id
                });
                console.log(`已删除运行 #${run.id}`);
              }
              page++;
            }
            console.log("全部运行记录及绑定Artifact清理完成");
