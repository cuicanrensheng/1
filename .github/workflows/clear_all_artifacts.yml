name: 一键清空所有构建记录与制品
on:
  workflow_dispatch: # 手动点击运行

jobs:
  clean_all:
    runs-on: ubuntu-latest
    env:
      # 消除Node20废弃警告（可选）
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 批量删除全部Workflow运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let page = 1;
            const perPage = 100;

            while (true) {
              // 正确API：不带workflow_id，直接查仓库所有运行记录，不会出现双斜杠404
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                per_page: perPage,
                page: page
              });

              const runList = response.data.workflow_runs;
              if (runList.length === 0) break;

              // 逐条删除每条运行记录（删除后自动连带删除对应Artifact）
              for (const run of runList) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✅ 已删除运行记录 #${run.id}`);
              }
              page += 1;
            }
            console.log("🎉 全部历史Workflow运行记录+绑定制品清理完成");
