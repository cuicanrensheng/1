# 启用AndroidX 必须开启
android.useAndroidX=true
android.enableJetifier=true
# 屏蔽旧ExoPlayer自动转换，避免新旧库冲突降级
android.jetifier.blacklist=com.google.android.exoplayer
# 消除compileSdk36警告
android.suppressUnsupportedCompileSdk=36
# AGP8.7 扩容虚拟机，防止依赖解析OOM导致版本错乱
org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=2048m
# 并行编译加速
org.gradle.parallel=true
# CI关闭本地构建缓存，不复用旧Media3包
org.gradle.caching=false
# 每次构建强制远程刷新依赖
org.gradle.refreshDependencies=true
# 完整日志方便排查依赖冲突
org.gradle.logging.level=lifecycle
