name: TVAPP云编译-FMMG播放器
# 触发条件：推送代码、手动点击运行工作流
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取项目源码
      - name: 拉取源码
        uses: gitee/actions/checkout@v3

      # 2.配置JDK11（安卓编译标配）
      - name: 配置Java环境
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3.配置Android SDK，最低Android5.0(API21)
      - name: 安装AndroidSDK
        run: |
          mkdir -p ~/.android
          echo "sdk.manager.auto.accept=yes" > ~/.android/sdkmanager.conf
          sdkmanager --install "platforms;android-21" "build-tools;30.0.3"

      # 4.Gradle打包正式包（Release）
      - name: Gradle编译打包
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      # 5.上传编译好的APK到编译产物
      - name: 归档APK安装包
        uses: actions/upload-artifact@v3
        with:
          name: TV-手机电视通用APK
          path: app/build/outputs/apk/release/*.apk

      # 6.自动打包上传至Release（可选，需要Gitee个人令牌）
